[package]
name = "pi-launcher"
version = "3.2.0"
description = "PI Launcher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.154"
sysinfo = "=0.40.4"
memchr = "=2.8.3"
dirs = "=7.0.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
