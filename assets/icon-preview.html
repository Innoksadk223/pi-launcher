<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>应用图标候选</title>
<style>
  :root{--ink:#eef1f6;--dim:#8b93a7;--line:#252a35}
  body{margin:0;background:#14161c;color:var(--ink);
       font:14px/1.6 -apple-system,"PingFang SC",sans-serif;padding:32px;
       display:flex;flex-direction:column;align-items:center;gap:28px;min-height:100vh}
  h1{font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0}
  .row{display:flex;gap:40px;flex-wrap:wrap;justify-content:center}
  figure{margin:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
  .stage{width:340px;height:300px;border-radius:12px;display:grid;place-items:center;position:relative;overflow:hidden}
  /* 深色桌面（Dock 常见背景） */
  .wall-dark{background:linear-gradient(160deg,#1d2130,#0e1016)}
  /* 浅色桌面，检查暗边 */
  .wall-light{background:linear-gradient(160deg,#e8ecf4,#cdd4e2)}
  .sizes{display:flex;align-items:flex-end;gap:18px}
  .sizes img{display:block;image-rendering:auto}
  .tag{font-size:12px;color:var(--dim)}
  .name{font-size:13px;font-weight:600}
  .label{font-size:11px;color:var(--dim);margin-top:4px}
  .pad{background:#0000;padding:0}
</style></head>
<body>
  <h1>PI 项目启动器 · 图标候选</h1>
  <div class="row">

    <figure>
      <div class="stage wall-dark">
        <div class="sizes">
          <img src="icon/AppIcon-checker-1024.png" width="128" height="128" alt="棋盘 128">
          <img src="icon/AppIcon-checker-1024.png" width="64" height="64" alt="棋盘 64">
          <img src="icon/AppIcon-checker-1024.png" width="32" height="32" alt="棋盘 32">
          <img src="icon/AppIcon-checker-1024.png" width="16" height="16" alt="棋盘 16">
        </div>
      </div>
      <figcaption><span class="name">A · 棋盘格底</span><div class="label">MACOS 圆角裁形 · 深色桌面</div></figcaption>
    </figure>

    <figure>
      <div class="stage wall-light">
        <div class="sizes">
          <img src="icon/AppIcon-checker-1024.png" width="128" height="128" alt="棋盘 128">
          <img src="icon/AppIcon-checker-1024.png" width="64" height="64" alt="棋盘 64">
          <img src="icon/AppIcon-checker-1024.png" width="32" height="32" alt="棋盘 32">
          <img src="icon/AppIcon-checker-1024.png" width="16" height="16" alt="棋盘 16">
        </div>
      </div>
      <figcaption><span class="name">A · 棋盘格底</span><div class="label">浅色桌面，检查边缘是否干净</div></figcaption>
    </figure>

    <figure>
      <div class="stage wall-dark">
        <div class="sizes">
          <img src="icon/AppIcon-clear-1024.png" width="128" height="128" alt="透明 128">
          <img src="icon/AppIcon-clear-1024.png" width="64" height="64" alt="透明 64">
          <img src="icon/AppIcon-clear-1024.png" width="32" height="32" alt="透明 32">
          <img src="icon/AppIcon-clear-1024.png" width="16" height="16" alt="透明 16">
        </div>
      </div>
      <figcaption><span class="name">B · 纯透明底</span><div class="label">主体浮空 · 深色桌面</div></figcaption>
    </figure>

    <figure>
      <div class="stage wall-light">
        <div class="sizes">
          <img src="icon/AppIcon-clear-1024.png" width="128" height="128" alt="透明 128">
          <img src="icon/AppIcon-clear-1024.png" width="64" height="64" alt="透明 64">
          <img src="icon/AppIcon-clear-1024.png" width="32" height="32" alt="透明 32">
          <img src="icon/AppIcon-clear-1024.png" width="16" height="16" alt="透明 16">
        </div>
      </div>
      <figcaption><span class="name">B · 纯透明底</span><div class="label">浅色桌面，检查边缘是否干净</div></figcaption>
    </figure>

  </div>
  <div class="tag">每组自左至右为 128 / 64 / 32 / 16 px —— Dock 实际显示尺寸</div>
</body></html>
